<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimitrios Bouras</title>
    <meta name="description" content="Dimitrios Stamatios Bouras — PhD researcher in Computer Science at Peking University (PL Lab). Research on LLM-based program analysis, coding agents, symbolic execution and software verification.">

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="images/logo.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
    <link rel="manifest" href="images/site.webmanifest">
    <link rel="mask-icon" href="images/safari-pinned-tab.svg" color="#1f2b2f">
    <link rel="shortcut icon" href="images/favicon.ico">
    <meta name="theme-color" content="#f8f6f1">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Source+Sans+3:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --paper: #f8f6f1;
            --paper-deep: #eeece5;
            --surface: #fffefa;
            --ink: #20272b;
            --ink-soft: #596369;
            --muted: #7c8589;
            --line: #dcdedb;
            --brand: #5f8792;
            --brand-deep: #345d69;
            --brand-wash: #e5eef0;
            --amber: #a86124;
            --amber-wash: #f7eadc;
            --night: #1f2b2f;
            --serif: "Newsreader", Iowan Old Style, Georgia, serif;
            --sans: "Source Sans 3", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --ui-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --mono: "DM Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            --shell: 1120px;
            --radius: 16px;
            --shadow: 0 24px 60px rgba(38, 51, 55, 0.09);
            --ease-out: cubic-bezier(.2, .75, .2, 1);
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; scroll-padding-top: 82px; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--ink);
            background: var(--paper);
            font-family: var(--sans);
            font-size: 17px;
            line-height: 1.62;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }
        main { flex: 1 0 auto; }
        img { max-width: 100%; }
        strong { color: var(--ink); font-weight: 600; }
        a, button { -webkit-tap-highlight-color: transparent; }
        a:focus-visible, button:focus-visible { outline: 3px solid var(--amber); outline-offset: 4px; }
        h1, h2 { font-family: var(--serif); font-weight: 500; letter-spacing: -0.045em; }
        h3 { font-weight: 600; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
        .site-shell { width: min(calc(100% - 48px), var(--shell)); margin-inline: auto; }
        .section-anchor { scroll-margin-top: 5rem; }
        [data-lang] { display: none; }
        html[lang="en"] [data-lang="en"],
        html[lang="zh"] [data-lang="zh"] { display: inline; }

        /* ---------- Scroll reveal ---------- */
        .reveal { opacity: 0; transform: translateY(26px); transition: opacity .75s var(--ease-out), transform .75s var(--ease-out); transition-delay: var(--d, 0ms); }
        .reveal.is-visible { opacity: 1; transform: none; }

        /* ---------- Header ---------- */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 30;
            font-family: var(--ui-sans);
            border-bottom: 1px solid color-mix(in srgb, var(--line) 88%, transparent);
            background: color-mix(in srgb, var(--paper) 86%, transparent);
            backdrop-filter: blur(16px) saturate(1.2);
        }
        .scroll-progress { position: absolute; left: 0; bottom: -1px; height: 2px; width: 100%; transform-origin: 0 50%; transform: scaleX(var(--progress, 0)); background: linear-gradient(90deg, var(--brand), var(--amber)); }
        .nav-shell { min-height: 68px; display: flex; align-items: center; gap: 28px; }
        .wordmark { display: inline-flex; align-items: baseline; gap: 2px; color: var(--ink); font-family: var(--ui-sans); font-size: 1.125rem; font-weight: 700; letter-spacing: -0.025em; text-decoration: none; }
        .wordmark-mark { align-self: center; width: 30px; height: 30px; margin-right: 8px; border-radius: 8px; transition: transform 300ms var(--ease-out); }
        .wordmark:hover .wordmark-mark { transform: rotate(-6deg) scale(1.06); }
        .wordmark-dot { color: var(--amber); display: inline-block; animation: dot-pulse 2.8s ease-in-out infinite; }
        @keyframes dot-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.6); } }
        .desktop-nav { display: flex; align-items: center; gap: clamp(14px, 2vw, 26px); margin-left: auto; }
        .desktop-nav a, .mobile-nav a { position: relative; color: var(--ink-soft); font-size: .86rem; font-weight: 600; text-decoration: none; transition: color 160ms ease; }
        .desktop-nav a::after { content: ""; position: absolute; left: 0; right: 0; bottom: -6px; height: 2px; border-radius: 2px; background: var(--amber); transform: scaleX(0); transition: transform 260ms var(--ease-out); }
        .desktop-nav a:hover, .mobile-nav a:hover, .desktop-nav a.is-active, .mobile-nav a.is-active { color: var(--brand-deep); }
        .desktop-nav a:hover::after, .desktop-nav a.is-active::after { transform: scaleX(1); }
        .nav-actions { display: flex; align-items: center; gap: 9px; }
        .nav-control, .nav-cv, .nav-toggle {
            min-height: 37px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: color-mix(in srgb, var(--surface) 80%, transparent);
            color: var(--ink-soft);
            font: 700 .8rem/1 var(--sans);
        }
        .nav-control, .nav-toggle { padding: 0 13px; cursor: pointer; white-space: nowrap; }
        .nav-cv { display: inline-flex; align-items: center; padding: 0 15px; color: #fff; border-color: var(--brand-deep); background: var(--brand-deep); text-decoration: none; }
        .nav-control:hover, .nav-toggle:hover { color: var(--brand-deep); border-color: var(--brand); }
        .nav-cv:hover { background: #284d57; }
        .nav-toggle { display: none; width: 39px; padding: 0; }
        .mobile-nav { border-top: 1px solid var(--line); background: var(--surface); }
        .mobile-nav-inner { width: min(calc(100% - 48px), var(--shell)); margin: 0 auto; padding: 12px 0 17px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .mobile-nav a { padding: 5px 0; text-align: center; }

        /* ---------- Hero ---------- */
        .hero { position: relative; isolation: isolate; overflow: hidden; padding: clamp(60px, 8vw, 104px) 0 clamp(64px, 8vw, 104px); }
        .hero::before {
            position: absolute;
            inset: 0;
            z-index: -2;
            content: "";
            background:
                radial-gradient(50% 70% at 88% 0%, color-mix(in srgb, var(--brand-wash) 86%, transparent), transparent 72%),
                radial-gradient(35% 55% at 3% 100%, color-mix(in srgb, var(--amber-wash) 58%, transparent), transparent 74%);
        }
        #hero-canvas { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; pointer-events: none; opacity: .9; mask-image: linear-gradient(to bottom, #000 70%, transparent); -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent); }
        .hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) 330px; align-items: center; gap: clamp(48px, 7vw, 96px); }
        .hero-visual { position: relative; perspective: 900px; }
        .portrait-tilt { position: relative; transition: transform 400ms var(--ease-out); transform-style: preserve-3d; }
        .portrait-wrap { position: relative; margin: 0; border-radius: 50%; }
        .portrait-wrap::before, .portrait-wrap::after { content: none; }
        .portrait-wrap img { position: relative; z-index: 1; display: block; width: 100%; aspect-ratio: 1; border: 8px solid var(--surface); border-radius: 50%; object-fit: cover; box-shadow: 0 22px 52px rgba(38, 51, 55, .17); }
        .portrait-orbit { position: absolute; inset: -18px; z-index: 0; border-radius: 50%; border: 1.5px dashed color-mix(in srgb, var(--brand) 55%, transparent); animation: spin 38s linear infinite; }
        .portrait-orbit::after { content: ""; position: absolute; top: 50%; left: -6px; width: 11px; height: 11px; margin-top: -5.5px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 5px color-mix(in srgb, var(--amber) 18%, transparent); }
        .portrait-glow { position: absolute; inset: 8%; z-index: -1; border-radius: 50%; background: conic-gradient(from 0deg, var(--brand-wash), var(--amber-wash), var(--brand-wash)); filter: blur(34px); animation: spin 18s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .eyebrow, .section-kicker {
            margin: 0 0 14px;
            color: var(--brand-deep);
            font: 700 .72rem/1.2 var(--sans);
            letter-spacing: .14em;
            text-transform: uppercase;
        }
        .eyebrow { display: inline-flex; align-items: center; gap: 9px; }
        .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #3f9a6b; box-shadow: 0 0 0 0 rgba(63, 154, 107, .5); animation: live 2.2s ease-out infinite; }
        @keyframes live { 0% { box-shadow: 0 0 0 0 rgba(63, 154, 107, .45); } 80%, 100% { box-shadow: 0 0 0 9px rgba(63, 154, 107, 0); } }
        .hero-copy h1 { margin: 0 0 10px; font-family: var(--ui-sans); font-size: clamp(3rem, 5.4vw, 5rem); font-weight: 700; letter-spacing: -.055em; line-height: .93; }
        .name-gradient { background: linear-gradient(100deg, var(--ink) 30%, var(--brand-deep) 60%, var(--amber) 85%, var(--ink) 100%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 9s ease-in-out infinite alternate; }
        @keyframes shimmer { from { background-position: 0% 0; } to { background-position: 100% 0; } }
        .hero-subtitle { margin: 0 0 18px; color: var(--brand-deep); font-size: 1.06rem; font-weight: 700; }
        .hero-body { max-width: 640px; margin: 0 0 28px; color: var(--ink-soft); line-height: 1.66; }
        .hero-actions { display: flex; flex-wrap: wrap; gap: 9px; }
        .action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 42px;
            padding: 0 15px;
            color: var(--ink-soft);
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            font-size: .87rem;
            font-weight: 700;
            text-decoration: none;
            transition: transform 180ms var(--ease-out), border-color 150ms ease, color 150ms ease, box-shadow 180ms ease;
        }
        button.action { cursor: pointer; font-family: inherit; }
        .action:hover { color: var(--brand-deep); border-color: var(--brand); transform: translateY(-2px); box-shadow: 0 8px 18px rgba(38, 51, 55, .08); }
        .action-primary { color: #fff; border-color: var(--brand-deep); background: var(--brand-deep); }
        .action-primary:hover { color: #fff; background: #284d57; }
        .wechat-icon { color: #07C160; }
        .scroll-cue { position: absolute; left: 50%; bottom: 22px; width: 24px; height: 38px; margin-left: -12px; border: 2px solid color-mix(in srgb, var(--ink-soft) 45%, transparent); border-radius: 14px; }
        .scroll-cue::after { content: ""; position: absolute; top: 7px; left: 50%; width: 4px; height: 8px; margin-left: -2px; border-radius: 2px; background: var(--amber); animation: cue 1.8s ease-in-out infinite; }
        @keyframes cue { 0% { opacity: 0; transform: translateY(0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(12px); } }


        /* ---------- Sections ---------- */
        .site-section { padding: clamp(70px, 9vw, 108px) 0; border-top: 1px solid var(--line); }
        .section-tint { background: color-mix(in srgb, var(--surface) 58%, var(--paper)); }
        .narrow-shell { max-width: 850px; }
        .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 32px; margin-bottom: 38px; }
        .section-heading h2 { margin: 0; font-size: clamp(2.35rem, 4.5vw, 3.55rem); line-height: 1.02; }
        .section-heading > a { flex: 0 0 auto; color: var(--brand-deep); font-size: .86rem; font-weight: 700; text-decoration: none; }
        .section-heading > a:hover { text-decoration: underline; text-underline-offset: 4px; }

        .about-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: clamp(30px, 6vw, 72px); align-items: start; }
        .about-copy { display: grid; gap: 18px; color: var(--ink-soft); }
        .about-copy p { margin: 0; }
        .lang-card { padding: 24px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
        .lang-card h3 { margin: 0 0 16px; color: var(--brand-deep); font: 700 .72rem/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; }
        .lang-row + .lang-row { margin-top: 14px; }
        .lang-head { display: flex; justify-content: space-between; gap: 12px; font-size: .9rem; font-weight: 600; }
        .lang-level { color: var(--muted); font: 500 .74rem/1.9 var(--mono); }
        .lang-bar { height: 6px; margin-top: 6px; overflow: hidden; border-radius: 99px; background: var(--paper-deep); }
        .lang-bar span { display: block; height: 100%; width: var(--w); border-radius: inherit; background: linear-gradient(90deg, var(--brand), var(--brand-deep)); transform-origin: 0 50%; transform: scaleX(0); transition: transform 1.2s var(--ease-out); transition-delay: var(--d, 0ms); }
        .is-visible .lang-bar span { transform: scaleX(1); }

        /* Spotlight cards (research + projects) */
        .spot { --mx: 50%; --my: 50%; position: relative; overflow: hidden; isolation: isolate; }
        .spot::before { content: ""; position: absolute; inset: 0; z-index: -1; opacity: 0; transition: opacity 260ms ease; background: radial-gradient(380px circle at var(--mx) var(--my), color-mix(in srgb, var(--brand-wash) 95%, transparent), transparent 60%); }
        .spot:hover::before { opacity: 1; }

        .research-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .research-card { min-height: 215px; padding: 26px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); transition: border-color 160ms ease, transform 260ms var(--ease-out), box-shadow 260ms ease; }
        .research-card:hover { border-color: var(--brand); transform: translateY(-4px); box-shadow: 0 18px 40px rgba(38, 51, 55, .09); }
        .research-card-index { display: block; margin-bottom: 42px; color: var(--amber); font: 500 .7rem/1 var(--mono); }
        .research-card-icon { position: absolute; top: 20px; right: 20px; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; background: var(--brand-wash); color: var(--brand-deep); font-size: 1rem; transition: transform 360ms var(--ease-out), background 200ms ease, color 200ms ease; }
        .research-card:hover .research-card-icon { transform: rotate(-8deg) scale(1.1); background: var(--brand-deep); color: #fff; }
        .research-card h3 { margin: 0 0 8px; font-size: 1.15rem; }
        .research-card p { margin: 0; color: var(--ink-soft); font-size: .92rem; line-height: 1.5; }

        /* ---------- Journey timeline ---------- */
        .journey-filters { position: relative; display: inline-flex; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
        .journey-filters button { position: relative; z-index: 1; min-height: 34px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-soft); cursor: pointer; font: 700 .82rem/1 var(--sans); transition: color 200ms ease; }
        .journey-filters button[aria-pressed="true"] { color: #fff; }
        .filter-pill { position: absolute; top: 4px; bottom: 4px; left: 0; border-radius: 999px; background: var(--brand-deep); transition: transform 380ms var(--ease-out), width 380ms var(--ease-out); }
        .timeline { position: relative; margin: 0; padding: 0; list-style: none; }
        .timeline-rail { position: absolute; top: 8px; bottom: 8px; left: 151px; width: 2px; border-radius: 2px; background: var(--line); }
        .timeline-rail span { position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(var(--amber), var(--brand)); transform-origin: 50% 0; transform: scaleY(var(--fill, 0)); }
        .t-item { position: relative; display: grid; grid-template-columns: 128px 48px minmax(0, 1fr); padding: 0 0 22px; }
        .t-item[hidden] { display: none; }
        .t-date { padding-top: 21px; color: var(--muted); font: 500 .76rem/1.5 var(--mono); text-align: right; }
        .t-date b { display: block; color: var(--ink); font-weight: 500; }
        .t-node { position: relative; display: flex; justify-content: center; padding-top: 18px; }
        .t-node span { display: grid; place-items: center; width: 30px; height: 30px; border: 2px solid var(--brand); border-radius: 50%; background: var(--surface); color: var(--brand-deep); font-size: .72rem; box-shadow: 0 0 0 5px var(--paper); transition: transform 300ms var(--ease-out), background 200ms ease, color 200ms ease; }
        .t-item.work .t-node span { border-color: var(--amber); color: var(--amber); }
        .t-item:hover .t-node span { transform: scale(1.18); background: var(--brand-deep); color: #fff; }
        .t-item.work:hover .t-node span { background: var(--amber); }
        .t-card { padding: 20px 22px 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); transition: border-color 160ms ease, transform 260ms var(--ease-out), box-shadow 260ms ease; }
        .t-item:hover .t-card { border-color: var(--brand); transform: translateX(4px); box-shadow: 0 16px 36px rgba(38, 51, 55, .08); }
        .t-item.work:hover .t-card { border-color: color-mix(in srgb, var(--amber) 60%, var(--line)); }
        .t-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
        .t-role { margin: 0; font-size: 1.14rem; line-height: 1.3; }
        .t-type { color: var(--brand-deep); font: 700 .66rem/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; }
        .t-item.work .t-type { color: var(--amber); }
        .t-org { margin: 3px 0 0; color: var(--ink-soft); font-size: .93rem; font-weight: 600; }
        .t-org span { color: var(--muted); font-weight: 400; }
        .t-highlight { display: inline-flex; align-items: center; gap: 7px; margin-top: 12px; padding: 5px 11px; border-radius: 8px; background: var(--brand-wash); color: var(--brand-deep); font-size: .8rem; font-weight: 700; }
        .t-item.work .t-highlight { background: var(--amber-wash); color: var(--amber); }
        .t-points { margin: 12px 0 0; padding-left: 18px; color: var(--ink-soft); font-size: .92rem; line-height: 1.55; }
        .t-points li + li { margin-top: 4px; }
        .t-points li::marker { color: var(--brand); }
        .t-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 13px; }
        .tag { padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink-soft); font: 500 .7rem/1.5 var(--mono); }

        /* ---------- Publications ---------- */
        .publication-list { margin: 0; padding: 0; border-top: 1px solid var(--line); list-style: none; }
        .publication-row { position: relative; display: grid; grid-template-columns: 155px minmax(0, 1fr); gap: 28px; padding: 25px 0 27px; border-bottom: 1px solid var(--line); }
        .publication-row::before { content: ""; position: absolute; left: -18px; top: 26px; bottom: 26px; width: 3px; border-radius: 3px; background: var(--amber); transform: scaleY(0); transform-origin: 50% 0; transition: transform 300ms var(--ease-out); }
        .publication-row:hover::before { transform: scaleY(1); }
        .publication-venue { color: var(--brand-deep); font: 700 .75rem/1.45 var(--sans); letter-spacing: .08em; text-transform: uppercase; padding-top: 6px; }
        .publication-venue-link { color: var(--brand-deep); text-decoration: none; }
        .publication-venue-link:hover { text-decoration: underline; text-underline-offset: 3px; }
        .publication-title { margin: 0; color: var(--ink); font-family: var(--serif); font-size: clamp(1.2rem, 2.2vw, 1.52rem); font-weight: 500; letter-spacing: -.025em; line-height: 1.25; }
        .publication-title-link { color: inherit; text-decoration: none; background: linear-gradient(var(--brand), var(--brand)) 0 100% / 0 1.5px no-repeat; transition: background-size 380ms var(--ease-out), color 160ms ease; }
        .publication-title-link:hover { color: var(--brand-deep); background-size: 100% 1.5px; }
        .publication-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
        .publication-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 999px; background: var(--brand-wash); color: var(--brand-deep); font-size: .72rem; font-weight: 700; }
        .publication-badge.status { background: var(--paper-deep); color: var(--ink-soft); }
        .publication-badge.invited-presentation { background: var(--amber-wash); color: var(--amber); text-decoration: none; }
        .publication-badge.invited-presentation:hover { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--amber) 42%, transparent); }
        .publication-actions { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 15px; }
        .publication-link { color: var(--brand-deep); font-size: .79rem; font-weight: 700; text-decoration: none; }
        .publication-link span[aria-hidden] { display: inline-block; transition: transform 200ms var(--ease-out); }
        .publication-link:hover { color: var(--amber); }
        .publication-link:hover span[aria-hidden] { transform: translate(2px, -2px); }

        /* ---------- Projects ---------- */
        .project-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
        .project-card { display: flex; flex-direction: column; min-height: 200px; padding: 22px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); transition: border-color 160ms ease, transform 260ms var(--ease-out), box-shadow 260ms ease; }
        .project-card:hover { border-color: var(--brand); transform: translateY(-4px); box-shadow: 0 18px 40px rgba(38, 51, 55, .09); }
        .project-group { margin: 0 0 16px; color: var(--ink-soft); font: 700 .78rem/1.2 var(--sans); letter-spacing: .1em; text-transform: uppercase; }
        .project-grid + .project-group { margin-top: 40px; }
        .project-links { display: flex; gap: 16px; margin-top: 14px; }
        .project-icon { display: grid; place-items: center; width: 40px; height: 40px; margin-bottom: 18px; border-radius: 11px; background: var(--brand-wash); color: var(--brand-deep); }

        .marquee-band { overflow: hidden; padding: 26px 0; border-top: 1px solid var(--line); background: var(--surface); }

        .marquee-track { display: flex; flex: 0 0 auto; gap: 10px; padding-right: 10px; animation: marquee 50s linear infinite; }
        .marquee.reverse .marquee-track { animation-direction: reverse; animation-duration: 60s; }
        .marquee:hover .marquee-track { animation-play-state: paused; }
        .marquee-track span { padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); color: var(--ink-soft); font: 500 .8rem/1.3 var(--mono); white-space: nowrap; }

        /* ---------- Honors ---------- */

        .honor-text { color: var(--ink-soft); }

        .footer-grid { display: grid; grid-template-columns: 1.3fr .8fr .7fr; gap: 50px; }

        .wechat-close { position: absolute; top: 11px; right: 11px; display: grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; }

                                    zh: "北京大学国际计算机科学优秀博士生奖学金" } },
            { year: "2025", icon: "fas fa-globe-asia", text: { en: "Chinese Government Scholarship for PhD studies at Peking University",
                                    zh: "中国政府奖学金（北京大学博士研究生）" } },
            { year: "2025", icon: "fas fa-microphone-alt", text: { en: "Best Presentation Award, GI @ ICSE 2025",
                                    zh: "GI @ ICSE 2025 最佳报告奖" } },
            { year: "2024", icon: "fas fa-medal", text: { en: "Ranked 1st — UCL Software Systems Engineering MSc, Class of 2024",
                                    zh: "UCL 软件系统工程硕士 2024 届第一名" } },
            { year: "2023", icon: "fas fa-hand-holding-heart", text: { en: "Eugenides Foundation & HELLENiQ ENERGY scholarships for postgraduate studies",
                                    zh: "Eugenides 基金会与 HELLENiQ ENERGY 研究生奖学金" } },
            { year: "2017", icon: "fas fa-atom", text: { en: "National Chemistry Olympiad — top performer, reserve for the International Chemistry Olympiad",
                                    zh: "希腊全国化学奥林匹克竞赛优秀选手，入选国际化学奥林匹克竞赛候补名单" } },
            { year: "2016", icon: "fas fa-landmark", text: { en: "European Youth Parliament of Greece — top participant, reserve for the 87th International Session",
                                    zh: "欧洲青年议会希腊代表选拔表现优异，入选第 87 届国际会议候补名单" } }
        ];

        // ---- CV files per language ----
        const cvFiles = { en: "CV.pdf", zh: "CV_Bouras_Ch.pdf" };

        // ===================== Rendering & language switching =====================
        const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
        const pick = (field, lang) => (field && typeof field === "object" && "en" in field) ? field[lang] : field;
        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        let journeyFilter = "all";

        function renderLists(lang) {
            document.getElementById("lang-list").innerHTML = spokenLanguages.map((l, i) => `
                <div class="lang-row">
                    <div class="lang-head"><span>${esc(pick(l.name, lang))}</span><span class="lang-level">${esc(pick(l.level, lang))}</span></div>
                    <div class="lang-bar"><span style="--w:${l.pct}%;--d:${200 + i * 140}ms"></span></div>
                </div>
            `).join("");

            document.getElementById("research-grid").innerHTML = researchInterests.map((r, index) => `
                <article class="research-card spot reveal" style="--d:${index * 80}ms">
                    <span class="research-card-index">${String(index + 1).padStart(2, "0")}</span>
                    <span class="research-card-icon" aria-hidden="true"><i class="${esc(r.icon)}"></i></span>
                    <h3>${esc(pick(r.title, lang))}</h3>
                    <p>${esc(pick(r.desc, lang))}</p>
                </article>
            `).join("");

            document.getElementById("journey-list").innerHTML = journey.map(j => `
                <li class="t-item ${j.type} reveal" data-type="${j.type}"${journeyFilter !== "all" && journeyFilter !== j.type ? " hidden" : ""}>
                    <div class="t-date"><b>${esc(pick(j.end, lang))}</b> ${esc(j.start)}</div>
                    <div class="t-node" aria-hidden="true"><span><i class="${esc(j.icon)}"></i></span></div>
                    <article class="t-card">
                        <div class="t-top">
                            <h3 class="t-role">${esc(pick(j.role, lang))}</h3>
                            <span class="t-type">${esc(pick(i18n[j.type === "work" ? "journey.typeWork" : "journey.typeEdu"], lang))}</span>
                        </div>
                        <p class="t-org">${esc(pick(j.org, lang))} <span>· ${esc(pick(j.place, lang))}</span></p>
                        ${j.highlight ? `<span class="t-highlight"><i class="${esc(j.highlight.icon)}" aria-hidden="true"></i>${esc(pick(j.highlight, lang))}</span>` : ""}
                        <ul class="t-points">${j.points.map(pt => `<li>${esc(pick(pt, lang))}</li>`).join("")}</ul>
                        ${j.tags ? `<div class="t-tags">${j.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
                    </article>
                </li>
            `).join("");

            document.getElementById("publications-list").innerHTML = publications.map(p => {
                const venue = p.venueLink
                    ? `<a href="${esc(p.venueLink)}" target="_blank" rel="noopener" class="publication-venue-link">${esc(pick(p.venue, lang))}</a>`
                    : esc(pick(p.venue, lang));
                const title = p.link
                    ? `<a href="${esc(p.link)}" target="_blank" rel="noopener" class="publication-title-link">${esc(p.title)}</a>`
                    : esc(p.title);
                const award = p.award
                    ? `<span class="publication-badge"><i class="fas fa-award" aria-hidden="true"></i>${esc(pick(p.award, lang))}</span>`
                    : "";
                const status = p.status
                    ? `<span class="publication-badge status">${esc(pick(p.status, lang))}</span>`
                    : "";
                const invitedPresentation = p.invitedPresentation
                    ? `<a href="${esc(p.invitedPresentation.link)}" target="_blank" rel="noopener" class="publication-badge invited-presentation"><i class="fas fa-microphone-alt" aria-hidden="true"></i>${esc(pick(p.invitedPresentation.label, lang))} <span aria-hidden="true">↗</span></a>`
                    : "";
                const actions = [
                    p.project
                        ? `<a href="${esc(p.project)}" target="_blank" rel="noopener" class="publication-link"><span data-i18n="pub.project">${esc(pick(i18n["pub.project"], lang))}</span> <span aria-hidden="true">↗</span></a>`
                        : "",
                    p.link
                        ? `<a href="${esc(p.link)}" target="_blank" rel="noopener" class="publication-link">${esc(pick(i18n["pub.paper"], lang))} <span aria-hidden="true">↗</span></a>`
                        : ""
                ].filter(Boolean).join("");
                return `
                    <li class="publication-row reveal">
                        <span class="publication-venue">${venue}</span>
                        <div>
                            <p class="publication-title">${title}</p>
                            ${(award || status || invitedPresentation) ? `<div class="publication-meta">${award}${status}${invitedPresentation}</div>` : ""}
                            ${actions ? `<div class="publication-actions">${actions}</div>` : ""}
                        </div>
                    </li>`;
            }).join("");

            const projectLink = (href, label) =>
                `<a href="${esc(href)}" target="_blank" rel="noopener" class="publication-link">${esc(label)} <span aria-hidden="true">↗</span></a>`;
            ["research", "engineering"].forEach(group => {
                document.getElementById(`project-grid-${group}`).innerHTML = projects.filter(p => p.group === group).map((p, i) => {
                    const links = [
                        p.project ? projectLink(p.project, pick(i18n["pub.project"], lang)) : "",
                        p.paper ? projectLink(p.paper, pick(i18n["pub.paper"], lang)) : "",
                        ...(p.links || []).map(l => projectLink(l.href, pick(l.label, lang)))
                    ].filter(Boolean).join("");
                    return `
                    <article class="project-card spot reveal" style="--d:${(i % 3) * 70}ms">
                        <span class="project-icon" aria-hidden="true"><i class="${esc(p.icon)}"></i></span>
                        ${p.context ? `<p class="project-context">${esc(pick(p.context, lang))}</p>` : ""}
                        <h3>${esc(pick(p.title, lang))}</h3>
                        <p>${esc(pick(p.desc, lang))}</p>
                        ${links ? `<div class="project-links">${links}</div>` : ""}
                        <div class="t-tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
                    </article>`;
                }).join("");
            });

            document.getElementById("honors-list").innerHTML = honors.map(h => `
                <li class="honor-row reveal">
                    <span class="honor-year">${esc(h.year)}</span>
                    <span class="honor-icon" aria-hidden="true"><i class="${esc(h.icon)}"></i></span>
                    <span class="honor-text">${esc(pick(h.text, lang))}</span>
                </li>
            `).join("");

            observeReveals();
            bindSpotlights();
            updateFilterPill();
        }

        function renderMarquee() {
            ["marquee-a", "marquee-b"].forEach((id, row) => {
                const items = skillRows[row].map(s => s.startsWith("*")
                    ? `<span class="hot">${esc(s.slice(1))}</span>`
                    : `<span>${esc(s)}</span>`).join("");
                // The track is duplicated so the loop is seamless; the copy is hidden from assistive tech.
                document.getElementById(id).innerHTML =
                    `<div class="marquee-track">${items}</div><div class="marquee-track" aria-hidden="true">${items}</div>`;
            });
        }

        function setLang(lang) {
            if (lang !== "zh") lang = "en";
            document.documentElement.setAttribute("lang", lang);
            // Static strings
            document.querySelectorAll("[data-i18n]").forEach(el => {
                const entry = i18n[el.getAttribute("data-i18n")];
                if (entry) el.innerHTML = entry[lang];
            });
            // CV links point to the matching language PDF
            const cv = cvFiles[lang];
            document.getElementById("cv-nav").setAttribute("href", cv);
            document.getElementById("cv-primary").setAttribute("href", cv);
            // Data-driven lists
            renderLists(lang);
            try { localStorage.setItem("lang", lang); } catch (e) {}
        }

        // ===================== Motion & interaction =====================

        // ---- Scroll reveal (elements already seen stay visible across re-renders) ----
        let revealObserver = null;
        let firstRenderDone = false;
        function observeReveals() {
            const items = document.querySelectorAll(".reveal:not(.is-visible)");
            if (reduceMotion || !("IntersectionObserver" in window)) {
                items.forEach(el => el.classList.add("is-visible"));
                return;
            }
            if (!revealObserver) {
                revealObserver = new IntersectionObserver(entries => {
                    entries.forEach(entry => {
                        if (!entry.isIntersecting) return;
                        entry.target.classList.add("is-visible");
                        revealObserver.unobserve(entry.target);
                    });
                }, { rootMargin: "0px 0px -8% 0px", threshold: 0.08 });
            }
            items.forEach(el => {
                // On a language switch, don't replay animations for content above the fold line.
                if (firstRenderDone && el.getBoundingClientRect().top < window.innerHeight) {
                    el.classList.add("is-visible");
                } else {
                    revealObserver.observe(el);
                }
            });
            firstRenderDone = true;
        }

        // ---- Mouse-follow spotlight on cards ----
        function bindSpotlights() {
            document.querySelectorAll(".spot:not([data-spot])").forEach(card => {
                card.dataset.spot = "1";
                card.addEventListener("pointermove", e => {
                    const r = card.getBoundingClientRect();
                    card.style.setProperty("--mx", `${e.clientX - r.left}px`);
                    card.style.setProperty("--my", `${e.clientY - r.top}px`);
                });
            });
        }

        // ---- Journey filters ----
        const filterWrap = document.getElementById("journey-filters");
        function updateFilterPill() {
            const active = filterWrap.querySelector('[aria-pressed="true"]');
            const pill = filterWrap.querySelector(".filter-pill");
            pill.style.width = `${active.offsetWidth}px`;
            pill.style.transform = `translateX(${active.offsetLeft}px)`;
        }
        filterWrap.querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => {
            journeyFilter = btn.dataset.filter;
            filterWrap.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
            updateFilterPill();
            document.querySelectorAll("#journey-list .t-item").forEach(item => {
                const show = journeyFilter === "all" || item.dataset.type === journeyFilter;
                item.hidden = !show;
                if (show && !reduceMotion) {
                    item.classList.remove("is-visible");
                    void item.offsetWidth;
                    requestAnimationFrame(() => item.classList.add("is-visible"));
                }
            });
            onScroll();
        }));

        // ---- Scroll-linked: progress bar, timeline fill, back-to-top, active nav ----
        const progressEl = document.getElementById("scroll-progress");
        const timelineEl = document.getElementById("timeline");
        const railFill = timelineEl.querySelector(".timeline-rail span");
        const toTop = document.getElementById("to-top");
        let ticking = false;
        function onScroll() {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(() => {
                const doc = document.documentElement;
                const max = doc.scrollHeight - window.innerHeight;
                progressEl.style.setProperty("--progress", max > 0 ? (window.scrollY / max).toFixed(4) : 0);
                const r = timelineEl.getBoundingClientRect();
                const fill = Math.min(1, Math.max(0, (window.innerHeight * 0.65 - r.top) / r.height));
                railFill.style.setProperty("--fill", fill.toFixed(4));
                toTop.classList.toggle("show", window.scrollY > window.innerHeight * 1.2);
                ticking = false;
            });
        }
        window.addEventListener("scroll", onScroll, { passive: true });
        toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" }));

        if ("IntersectionObserver" in window) {
            const navLinks = document.querySelectorAll(".desktop-nav a, .mobile-nav a");
            const sectionObserver = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    const id = entry.target.id;
                    navLinks.forEach(a => a.classList.toggle("is-active", a.getAttribute("href") === `#${id}`));
                });
            }, { rootMargin: "-45% 0px -50% 0px" });
            document.querySelectorAll("main section[id], footer[id]").forEach(s => sectionObserver.observe(s));
        }

        // ---- Portrait tilt ----
        const tilt = document.getElementById("portrait-tilt");
        const heroVisual = tilt.parentElement;
        if (!reduceMotion && window.matchMedia("(hover: hover)").matches) {
            heroVisual.addEventListener("pointermove", e => {
                const r = heroVisual.getBoundingClientRect();
                const x = (e.clientX - r.left) / r.width - .5;
                const y = (e.clientY - r.top) / r.height - .5;
                tilt.style.transform = `rotateY(${x * 14}deg) rotateX(${-y * 14}deg)`;
            });
            heroVisual.addEventListener("pointerleave", () => { tilt.style.transform = ""; });
        }

        // ---- Hero canvas: a drifting program graph with data flowing along its edges ----
        (function heroGraph() {
            const canvas = document.getElementById("hero-canvas");
            const ctx = canvas.getContext("2d");
            const hero = document.getElementById("top");
            let w = 0, h = 0, nodes = [], pulses = [], running = false, raf = 0;
            const mouse = { x: -9999, y: -9999 };
            const LINK = 150;

            function resize() {
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                w = hero.clientWidth; h = hero.clientHeight;
                canvas.width = w * dpr; canvas.height = h * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                const n = Math.min(70, Math.round((w * h) / 16000));
                nodes = Array.from({ length: n }, () => ({
                    x: Math.random() * w, y: Math.random() * h,
                    vx: (Math.random() - .5) * .28, vy: (Math.random() - .5) * .28,
                    r: Math.random() * 1.6 + 1.2, amber: Math.random() < .14
                }));
                pulses = [];
                if (reduceMotion) draw();
            }

            function draw() {
                ctx.clearRect(0, 0, w, h);
                for (let i = 0; i < nodes.length; i++) {
                    const a = nodes[i];
                    for (let j = i + 1; j < nodes.length; j++) {
                        const b = nodes[j];
                        const d = Math.hypot(a.x - b.x, a.y - b.y);
                        if (d < LINK) {
                            ctx.strokeStyle = `rgba(95, 135, 146, ${(1 - d / LINK) * .28})`;
                            ctx.lineWidth = 1;
                            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
                        }
                    }
                }
                pulses.forEach(p => {
                    const x = p.a.x + (p.b.x - p.a.x) * p.t, y = p.a.y + (p.b.y - p.a.y) * p.t;
                    ctx.fillStyle = "rgba(168, 97, 36, .85)";
                    ctx.beginPath(); ctx.arc(x, y, 2.2, 0, Math.PI * 2); ctx.fill();
                });
                nodes.forEach(n => {
                    const near = Math.hypot(n.x - mouse.x, n.y - mouse.y) < 120;
                    ctx.fillStyle = n.amber ? "rgba(168, 97, 36, .7)" : `rgba(52, 93, 105, ${near ? .75 : .4})`;
                    ctx.beginPath(); ctx.arc(n.x, n.y, n.r + (near ? 1.2 : 0), 0, Math.PI * 2); ctx.fill();
                });
            }

            function step() {
                nodes.forEach(n => {
                    const dx = mouse.x - n.x, dy = mouse.y - n.y, d = Math.hypot(dx, dy);
                    if (d < 160 && d > 1) { n.vx += dx / d * .012; n.vy += dy / d * .012; }
                    n.vx *= .992; n.vy *= .992;
                    const sp = Math.hypot(n.vx, n.vy);
                    if (sp < .08) { n.vx += (Math.random() - .5) * .04; n.vy += (Math.random() - .5) * .04; }
                    n.x += n.vx; n.y += n.vy;
                    if (n.x < -20) n.x = w + 20; if (n.x > w + 20) n.x = -20;
                    if (n.y < -20) n.y = h + 20; if (n.y > h + 20) n.y = -20;
                });
                if (pulses.length < 6 && Math.random() < .05) {
                    const a = nodes[Math.floor(Math.random() * nodes.length)];
                    const b = nodes.find(m => m !== a && Math.hypot(a.x - m.x, a.y - m.y) < LINK);
                    if (b) pulses.push({ a, b, t: 0 });
                }
                pulses = pulses.filter(p => (p.t += .012) < 1 && Math.hypot(p.a.x - p.b.x, p.a.y - p.b.y) < LINK);
                draw();
                raf = requestAnimationFrame(step);
            }

            const start = () => { if (!running && !reduceMotion) { running = true; raf = requestAnimationFrame(step); } };
            const stop = () => { running = false; cancelAnimationFrame(raf); };

            hero.addEventListener("pointermove", e => {
                const r = hero.getBoundingClientRect();
                mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top;
            });
            hero.addEventListener("pointerleave", () => { mouse.x = mouse.y = -9999; });
            let resizeTimer;
            window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 150); });
            resize();
            if ("IntersectionObserver" in window) {
                new IntersectionObserver(([e]) => (e.isIntersecting ? start() : stop())).observe(hero);
            } else start();
            document.addEventListener("visibilitychange", () => (document.hidden ? stop() : start()));
        })();

        // Init
        renderMarquee();
        let initial = "en";
        try { if (localStorage.getItem("lang") === "zh") initial = "zh"; } catch (e) {}
        setLang(initial);
        onScroll();

        document.getElementById("lang-toggle").addEventListener("click", () => {
            setLang(document.documentElement.getAttribute("lang") === "zh" ? "en" : "zh");
        });

        // ---- Mobile navigation ----
        const navToggle = document.getElementById("nav-toggle");
        const mobileNav = document.getElementById("mobile-nav");
        const closeMobileNav = () => {
            mobileNav.classList.add("hidden");
            navToggle.setAttribute("aria-expanded", "false");
        };
        navToggle.addEventListener("click", () => {
            const willOpen = mobileNav.classList.contains("hidden");
            mobileNav.classList.toggle("hidden", !willOpen);
            navToggle.setAttribute("aria-expanded", String(willOpen));
        });
        mobileNav.querySelectorAll("a").forEach(link => link.addEventListener("click", closeMobileNav));
        window.addEventListener("resize", () => {
            if (window.innerWidth > 860) closeMobileNav();
            updateFilterPill();
        });

        // ---- WeChat QR popup ----
        const wechatModal = document.getElementById("wechat-modal");
        const openWechat  = () => { wechatModal.classList.remove("hidden"); document.body.style.overflow = "hidden"; document.getElementById("wechat-close").focus(); };
        const closeWechat = () => { wechatModal.classList.add("hidden"); document.body.style.overflow = ""; };
        document.getElementById("wechat-btn").addEventListener("click", openWechat);
        document.getElementById("wechat-close").addEventListener("click", closeWechat);
        document.getElementById("wechat-overlay").addEventListener("click", closeWechat);
        document.addEventListener("keydown", e => { if (e.key === "Escape") closeWechat(); });

        document.fonts && document.fonts.ready.then(updateFilterPill);
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>
</body>
</html>
